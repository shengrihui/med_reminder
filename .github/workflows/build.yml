name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@v4.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: ''

      - name: Install Android SDK Platform 36 and Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2.0.9
        with:
          files: app/build/outputs/apk/release/app-release.apk
          tag_name: ${{ github.ref_name }}
          name: MedReminder ${{ github.ref_name }}
          body: |
            # MedReminder ${{ github.ref_name }}

            ### v0.6.0 更新内容
            - 支持为每天的多次服药分别设置多个提醒时间点
            - 某次服药确认后，自动停止该次剩余时间点的提醒
            - 重新开机后补发当天关机期间错过的服药提醒
            - 跨天后自动结束昨天未确认的持续提醒，并记录为已错过
            - 改进历史记录页面的无障碍朗读与操作体验
            - 自动迁移旧版数据，保留已有药品和服药历史

            ### 系统要求
            - Android 8.0 (API 26) 及以上
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
