name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@v4.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: ''

      - name: Install Android SDK Platform 36.1 and Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2.0.9
        with:
          files: app/build/outputs/apk/release/app-release.apk
          tag_name: ${{ github.ref_name }}
          name: MedReminder ${{ github.ref_name }}
          body: |
            # MedReminder ${{ github.ref_name }}

            ### v0.7.0 更新内容
            - 每个固定提醒使用独立的后续提醒链，避免多个提醒互相覆盖
            - “稍后提醒”可选10分钟、30分钟、1小时或自定义时长
            - “已服用”会完成当前这次服药，并取消该次剩余的所有闹钟和通知
            - 服药安排可自定义为“早餐后”“睡前”等名称
            - 精简首页读屏内容，并增加通知与精确提醒未开启时的显眼提示
            - 使用新的高重要性通知渠道，改善声音、振动和横幅提示

            ### 系统要求
            - Android 8.0 (API 26) 及以上
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
